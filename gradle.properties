android.suppressUnsupportedCompileSdk=35
android.disallowKotlinSourceSets=false
# Improves project import performance for large projects
android.dependency.excludeLibraryComponentsFromConstraints=true
# Suppress sync issue warning
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# 16 KB page size support
android.useLegacyPackaging=false

android.useAndroidX=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.version=1.9.20

# Performance defaults for faster local builds.
# If Windows file-handle issues return, we can selectively roll these back.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.workers.max=4
org.gradle.vfs.watch=true
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.enabled=true
ksp.incremental=true
