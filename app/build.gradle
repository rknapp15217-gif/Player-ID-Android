plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
}

android {
    namespace = 'com.playerid.app'
    compileSdk = 34

    defaultConfig {
        applicationId = "com.playerid.app"
        minSdk = 26
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
        buildConfigField "String", "TEAMSNAP_CLIENT_ID", '"TODO_TEAMSNAP_CLIENT_ID"'
        buildConfigField "String", "TEAMSNAP_CLIENT_SECRET", '""'

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
        
        renderscriptTargetApi = 34
        renderscriptSupportModeEnabled = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Removed deprecated useLegacyPackaging option
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }
    
    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.1'
    }

    androidResources {
        noCompress += [
            'tflite',
            'lite',
            'binarypb',
            'bincfg',
            'fb',
            'pb'
        ]
    }
    
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.0'
    implementation 'androidx.activity:activity:1.9.0'
