configurations.all {
    resolutionStrategy.force(
        'androidx.compose.ui:ui-text-google-fonts:1.4.3',
        'androidx.compose.ui:ui-test-manifest:1.4.3'
    )
}

tasks.withType(JavaCompile).configureEach {
    onlyIf {
        source.files.any { it.exists() }
    }
}